<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">IMU-Based Gesture Recognition System Architecture</text>
  
  <!-- Boxes -->
  <!-- IMU Data Acquisition -->
  <rect x="50" y="100" width="140" height="70" fill="#b3e0ff" stroke="#2980b9" stroke-width="2" rx="5" ry="5" />
  <text x="120" y="140" font-family="Arial" font-size="16" text-anchor="middle">IMU Data Acquisition</text>
  
  <!-- Signal Processing -->
  <rect x="250" y="100" width="140" height="70" fill="#b3e0ff" stroke="#2980b9" stroke-width="2" rx="5" ry="5" />
  <text x="320" y="140" font-family="Arial" font-size="16" text-anchor="middle">Signal Processing</text>
  
  <!-- TensorFlow Lite Runtime -->
  <rect x="450" y="100" width="140" height="70" fill="#ffcccc" stroke="#c0392b" stroke-width="2" rx="5" ry="5" />
  <text x="520" y="135" font-family="Arial" font-size="16" text-anchor="middle">TensorFlow Lite</text>
  <text x="520" y="155" font-family="Arial" font-size="16" text-anchor="middle">Runtime</text>
  
  <!-- Classification Output -->
  <rect x="650" y="100" width="140" height="70" fill="#d6f5d6" stroke="#27ae60" stroke-width="2" rx="5" ry="5" />
  <text x="720" y="140" font-family="Arial" font-size="16" text-anchor="middle">Classification Output</text>
  
  <!-- Tensor Arena -->
  <rect x="450" y="230" width="140" height="70" fill="#ffe6cc" stroke="#d35400" stroke-width="2" rx="5" ry="5" />
  <text x="520" y="265" font-family="Arial" font-size="16" text-anchor="middle">Tensor Arena</text>
  <text x="520" y="285" font-family="Arial" font-size="12" text-anchor="middle">(70KB Memory Buffer)</text>
  
  <!-- Communication Interface -->
  <rect x="650" y="230" width="140" height="70" fill="#e6e6fa" stroke="#8e44ad" stroke-width="2" rx="5" ry="5" />
  <text x="720" y="265" font-family="Arial" font-size="16" text-anchor="middle">Communication</text>
  <text x="720" y="285" font-family="Arial" font-size="16" text-anchor="middle">Interface</text>
  
  <!-- EFR32xG24 MCU box -->
  <rect x="30" y="80" width="770" height="250" stroke="#34495e" stroke-width="3" stroke-dasharray="10,5" fill="none" rx="15" ry="15" />
  <text x="120" y="330" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">EFR32xG24 Microcontroller</text>
  
  <!-- Arrows -->
  <path d="M190 135 L250 135" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M390 135 L450 135" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M590 135 L650 135" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M520 170 L520 230" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M720 170 L720 230" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead Marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
</svg>

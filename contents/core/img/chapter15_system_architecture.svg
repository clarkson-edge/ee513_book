<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Posture Detection System Architecture</text>
  
  <!-- Main Development Board -->
  <rect x="300" y="100" width="200" height="150" rx="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2"/>
  <text x="400" y="125" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">EFR32xG24 Dev Kit</text>
  
  <!-- On-board Components -->
  <rect x="325" y="140" width="150" height="30" rx="5" fill="#cce5ff" stroke="#0066cc" stroke-width="1"/>
  <text x="400" y="160" font-family="Arial" font-size="12" text-anchor="middle">ARM Cortex-M33</text>
  
  <rect x="325" y="180" width="70" height="30" rx="5" fill="#cce5ff" stroke="#0066cc" stroke-width="1"/>
  <text x="360" y="200" font-family="Arial" font-size="10" text-anchor="middle">IMU</text>
  
  <rect x="405" y="180" width="70" height="30" rx="5" fill="#cce5ff" stroke="#0066cc" stroke-width="1"/>
  <text x="440" y="200" font-family="Arial" font-size="10" text-anchor="middle">BLE Radio</text>
  
  <rect x="325" y="220" width="70" height="20" rx="5" fill="#cce5ff" stroke="#0066cc" stroke-width="1"/>
  <text x="360" y="235" font-family="Arial" font-size="9" text-anchor="middle">ML Accelerator</text>
  
  <rect x="405" y="220" width="70" height="20" rx="5" fill="#cce5ff" stroke="#0066cc" stroke-width="1"/>
  <text x="440" y="235" font-family="Arial" font-size="9" text-anchor="middle">Flash/RAM</text>
  
  <!-- Data Acquisition -->
  <rect x="100" y="300" width="150" height="80" rx="5" fill="#e6ffe6" stroke="#009900" stroke-width="2"/>
  <text x="175" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Data Acquisition</text>
  <text x="175" y="345" font-family="Arial" font-size="10" text-anchor="middle">6-Axis IMU Data</text>
  <text x="175" y="365" font-family="Arial" font-size="10" text-anchor="middle">4000ms Windows</text>
  
  <!-- Signal Processing -->
  <rect x="300" y="300" width="150" height="80" rx="5" fill="#fff2e6" stroke="#ff9933" stroke-width="2"/>
  <text x="375" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Signal Processing</text>
  <text x="375" y="345" font-family="Arial" font-size="10" text-anchor="middle">Spectral Analysis</text>
  <text x="375" y="365" font-family="Arial" font-size="10" text-anchor="middle">Feature Extraction</text>
  
  <!-- Neural Network -->
  <rect x="500" y="300" width="150" height="80" rx="5" fill="#ffe6e6" stroke="#cc0000" stroke-width="2"/>
  <text x="575" y="325" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Neural Network</text>
  <text x="575" y="345" font-family="Arial" font-size="10" text-anchor="middle">5-Class Classification</text>
  <text x="575" y="365" font-family="Arial" font-size="10" text-anchor="middle">Int8 Quantized Model</text>
  
  <!-- Output -->
  <rect x="300" y="440" width="150" height="80" rx="5" fill="#e6e6ff" stroke="#0000cc" stroke-width="2"/>
  <text x="375" y="465" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">BLE Communication</text>
  <text x="375" y="485" font-family="Arial" font-size="10" text-anchor="middle">Real-time Alerts</text>
  <text x="375" y="505" font-family="Arial" font-size="10" text-anchor="middle">Monitoring Applications</text>
  
  <!-- Arrows -->
  <line x1="400" y1="250" x2="400" y2="270" stroke="#666666" stroke-width="2"/>
  <polygon points="400,280 395,270 405,270" fill="#666666"/>
  
  <line x1="175" y1="380" x2="175" y2="400" stroke="#666666" stroke-width="2"/>
  <line x1="175" y1="400" x2="300" y2="400" stroke="#666666" stroke-width="2"/>
  <polygon points="310,400 300,395 300,405" fill="#666666"/>
  
  <line x1="450" y1="340" x2="490" y2="340" stroke="#666666" stroke-width="2"/>
  <polygon points="500,340 490,335 490,345" fill="#666666"/>
  
  <line x1="250" y1="340" x2="290" y2="340" stroke="#666666" stroke-width="2"/>
  <polygon points="300,340 290,335 290,345" fill="#666666"/>
  
  <line x1="575" y1="380" x2="575" y2="440" stroke="#666666" stroke-width="2"/>
  <line x1="575" y1="440" x2="450" y2="440" stroke="#666666" stroke-width="2"/>
  <polygon points="450,440 460,435 460,445" fill="#666666"/>
  
  <!-- Mobile Phone -->
  <rect x="550" y="450" width="60" height="100" rx="10" fill="#f2f2f2" stroke="#333333" stroke-width="2"/>
  <rect x="560" y="460" width="40" height="70" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <circle cx="580" cy="540" r="7" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  
  <!-- Bluetooth Connection -->
  <path d="M 450 480 Q 500 480 540 480" stroke="#0000cc" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <text x="500" y="470" font-family="Arial" font-size="10" text-anchor="middle" fill="#0000cc">BLE</text>
  
  <!-- Legend -->
  <rect x="650" y="100" width="120" height="120" fill="#f9f9f9" stroke="#cccccc" stroke-width="1"/>
  <text x="710" y="120" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Legend</text>
  
  <rect x="660" y="135" width="15" height="15" fill="#e6f2ff" stroke="#0066cc" stroke-width="1"/>
  <text x="685" y="147" font-family="Arial" font-size="10" text-anchor="start">Hardware</text>
  
  <rect x="660" y="160" width="15" height="15" fill="#e6ffe6" stroke="#009900" stroke-width="1"/>
  <text x="685" y="172" font-family="Arial" font-size="10" text-anchor="start">Data Collection</text>
  
  <rect x="660" y="185" width="15" height="15" fill="#fff2e6" stroke="#ff9933" stroke-width="1"/>
  <text x="685" y="197" font-family="Arial" font-size="10" text-anchor="start">Processing</text>
  
  <rect x="660" y="210" width="15" height="15" fill="#ffe6e6" stroke="#cc0000" stroke-width="1"/>
  <text x="685" y="222" font-family="Arial" font-size="10" text-anchor="start">Machine Learning</text>
</svg>
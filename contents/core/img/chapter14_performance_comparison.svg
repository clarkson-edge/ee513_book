<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa" rx="10" ry="10" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Performance Comparison Across Platforms</text>
  
  <!-- Legend -->
  <rect x="550" y="80" width="20" height="20" fill="#3498db" />
  <text x="580" y="95" font-family="Arial" font-size="14">Microcontroller</text>
  
  <rect x="550" y="110" width="20" height="20" fill="#e74c3c" />
  <text x="580" y="125" font-family="Arial" font-size="14">Mobile Phone</text>
  
  <rect x="550" y="140" width="20" height="20" fill="#2ecc71" />
  <text x="580" y="155" font-family="Arial" font-size="14">Cloud Server</text>
  
  <!-- Axes -->
  <line x1="100" y1="420" x2="700" y2="420" stroke="#333" stroke-width="2" />
  <line x1="100" y1="420" x2="100" y2="100" stroke="#333" stroke-width="2" />
  
  <!-- X-Axis Labels -->
  <text x="180" y="450" font-family="Arial" font-size="16" text-anchor="middle">Inference Time</text>
  <text x="320" y="450" font-family="Arial" font-size="16" text-anchor="middle">Latency</text>
  <text x="460" y="450" font-family="Arial" font-size="16" text-anchor="middle">Privacy</text>
  <text x="600" y="450" font-family="Arial" font-size="16" text-anchor="middle">Power Efficiency</text>
  
  <!-- Y-Axis Label -->
  <text x="60" y="250" font-family="Arial" font-size="16" text-anchor="middle" transform="rotate(-90 60,250)">Performance Score</text>
  
  <!-- Y-Axis Ticks -->
  <line x1="95" y1="100" x2="105" y2="100" stroke="#333" stroke-width="2" />
  <text x="85" y="105" font-family="Arial" font-size="14" text-anchor="end">100</text>
  
  <line x1="95" y1="180" x2="105" y2="180" stroke="#333" stroke-width="2" />
  <text x="85" y="185" font-family="Arial" font-size="14" text-anchor="end">75</text>
  
  <line x1="95" y1="260" x2="105" y2="260" stroke="#333" stroke-width="2" />
  <text x="85" y="265" font-family="Arial" font-size="14" text-anchor="end">50</text>
  
  <line x1="95" y1="340" x2="105" y2="340" stroke="#333" stroke-width="2" />
  <text x="85" y="345" font-family="Arial" font-size="14" text-anchor="end">25</text>
  
  <line x1="95" y1="420" x2="105" y2="420" stroke="#333" stroke-width="2" />
  <text x="85" y="425" font-family="Arial" font-size="14" text-anchor="end">0</text>
  
  <!-- Bars: Inference Time (lower is better, inverted scale) -->
  <!-- Microcontroller: 200ms -> ~30% score -->
  <rect x="150" y="340" width="20" height="80" fill="#3498db" />
  <text x="160" y="335" font-family="Arial" font-size="12" text-anchor="middle">30</text>
  
  <!-- Mobile: 30ms -> ~80% score -->
  <rect x="180" y="180" width="20" height="240" fill="#e74c3c" />
  <text x="190" y="175" font-family="Arial" font-size="12" text-anchor="middle">80</text>
  
  <!-- Cloud: 10ms -> ~90% score -->
  <rect x="210" y="140" width="20" height="280" fill="#2ecc71" />
  <text x="220" y="135" font-family="Arial" font-size="12" text-anchor="middle">90</text>
  
  <!-- Bars: Latency (lower is better, inverted scale) -->
  <!-- Microcontroller: <1ms -> ~95% score -->
  <rect x="290" y="120" width="20" height="300" fill="#3498db" />
  <text x="300" y="115" font-family="Arial" font-size="12" text-anchor="middle">95</text>
  
  <!-- Mobile: <1ms -> ~95% score -->
  <rect x="320" y="120" width="20" height="300" fill="#e74c3c" />
  <text x="330" y="115" font-family="Arial" font-size="12" text-anchor="middle">95</text>
  
  <!-- Cloud: 100-500ms -> ~20% score -->
  <rect x="350" y="370" width="20" height="50" fill="#2ecc71" />
  <text x="360" y="365" font-family="Arial" font-size="12" text-anchor="middle">20</text>
  
  <!-- Bars: Privacy -->
  <!-- Microcontroller: High -> ~90% score -->
  <rect x="430" y="140" width="20" height="280" fill="#3498db" />
  <text x="440" y="135" font-family="Arial" font-size="12" text-anchor="middle">90</text>
  
  <!-- Mobile: Medium -> ~60% score -->
  <rect x="460" y="240" width="20" height="180" fill="#e74c3c" />
  <text x="470" y="235" font-family="Arial" font-size="12" text-anchor="middle">60</text>
  
  <!-- Cloud: Low -> ~30% score -->
  <rect x="490" y="340" width="20" height="80" fill="#2ecc71" />
  <text x="500" y="335" font-family="Arial" font-size="12" text-anchor="middle">30</text>
  
  <!-- Bars: Power Efficiency -->
  <!-- Microcontroller: High -> ~90% score -->
  <rect x="570" y="140" width="20" height="280" fill="#3498db" />
  <text x="580" y="135" font-family="Arial" font-size="12" text-anchor="middle">90</text>
  
  <!-- Mobile: Medium -> ~50% score -->
  <rect x="600" y="260" width="20" height="160" fill="#e74c3c" />
  <text x="610" y="255" font-family="Arial" font-size="12" text-anchor="middle">50</text>
  
  <!-- Cloud: Low -> ~20% score -->
  <rect x="630" y="370" width="20" height="50" fill="#2ecc71" />
  <text x="640" y="365" font-family="Arial" font-size="12" text-anchor="middle">20</text>
  
  <!-- Footer Notes -->
  <text x="400" y="485" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">
    *Cloud server inference time excludes network transfer delays
  </text>
</svg>

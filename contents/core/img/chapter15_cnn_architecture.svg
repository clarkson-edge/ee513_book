<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <style>
    .input-layer { fill: #a8e6a8; stroke: #555; stroke-width: 1.5; rx: 6; ry: 6; }
    .conv-layer { fill: #a8d1f0; stroke: #555; stroke-width: 1.5; rx: 6; ry: 6; }
    .pool-layer { fill: #ffe199; stroke: #555; stroke-width: 1.5; rx: 6; ry: 6; }
    .flatten-layer { fill: #ffcccb; stroke: #555; stroke-width: 1.5; rx: 6; ry: 6; }
    .dense-layer { fill: #d8b5e5; stroke: #555; stroke-width: 1.5; rx: 6; ry: 6; }
    .output-layer { fill: #ffb6af; stroke: #555; stroke-width: 1.5; rx: 6; ry: 6; }
    .connection { stroke: #555; stroke-width: 2; }
    .label { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
    .detail { font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; }
    .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; text-anchor: middle; fill: #333; }
  </style>

  <!-- Title -->
  <text x="450" y="40" class="title">CNN Architecture for Gesture Recognition</text>

  <!-- Input Layer -->
  <rect x="30" y="70" width="100" height="160" class="input-layer" />
  <text x="80" y="145" class="label">Input</text>
  <text x="80" y="165" class="detail">(80, 3, 1)</text>
  <text x="80" y="230" class="detail">80 time steps</text>
  <text x="80" y="245" class="detail">3 acc axes</text>

  <!-- Conv2D Layer 1 -->
  <rect x="170" y="70" width="100" height="160" class="conv-layer" />
  <text x="220" y="145" class="label">Conv2D</text>
  <text x="220" y="165" class="detail">(8 filters)</text>
  <text x="220" y="230" class="detail">4x1 kernel</text>
  <text x="220" y="245" class="detail">ReLU</text>

  <!-- MaxPool2D Layer 1 -->
  <rect x="310" y="70" width="100" height="160" class="pool-layer" />
  <text x="360" y="145" class="label">MaxPool2D</text>
  <text x="360" y="230" class="detail">3x1 pool</text>

  <!-- Conv2D Layer 2 -->
  <rect x="450" y="70" width="100" height="160" class="conv-layer" />
  <text x="500" y="145" class="label">Conv2D</text>
  <text x="500" y="165" class="detail">(16 filters)</text>
  <text x="500" y="230" class="detail">4x1 kernel</text>
  <text x="500" y="245" class="detail">ReLU</text>

  <!-- MaxPool2D Layer 2 -->
  <rect x="590" y="70" width="100" height="160" class="pool-layer" />
  <text x="640" y="145" class="label">MaxPool2D</text>
  <text x="640" y="230" class="detail">3x1 pool</text>

  <!-- Flatten Layer -->
  <rect x="730" y="100" width="60" height="100" class="flatten-layer" />
  <text x="760" y="145" class="label">Flatten</text>

  <!-- Dense Layer -->
  <rect x="830" y="100" width="60" height="40" class="dense-layer" />
  <text x="860" y="125" class="label">Dense</text>
  <text x="860" y="140" class="detail">32 neurons</text>
  <text x="860" y="155" class="detail">ReLU</text>

  <!-- Output Layer -->
  <rect x="830" y="160" width="60" height="40" class="output-layer" />
  <text x="860" y="185" class="label">Output</text>
  <text x="860" y="200" class="detail">5 classes</text>
  <text x="860" y="215" class="detail">Softmax</text>

  <!-- Connections -->
  <line x1="130" y1="150" x2="170" y2="150" class="connection" />
  <line x1="270" y1="150" x2="310" y2="150" class="connection" />
  <line x1="410" y1="150" x2="450" y2="150" class="connection" />
  <line x1="550" y1="150" x2="590" y2="150" class="connection" />
  <line x1="690" y1="150" x2="730" y2="150" class="connection" />
  <line x1="790" y1="120" x2="830" y2="120" class="connection" />
  <line x1="790" y1="180" x2="830" y2="180" class="connection" />
</svg>
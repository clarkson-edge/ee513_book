<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">BLE Communication Workflow</text>
  
  <!-- Top BLE Device -->
  <rect x="150" y="80" width="200" height="100" rx="10" fill="#e6f2ff" stroke="#0066cc" stroke-width="2"/>
  <text x="250" y="120" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">EFR32xG24</text>
  <text x="250" y="145" font-family="Arial" font-size="12" text-anchor="middle">Posture Detection System</text>
  
  <!-- Bottom Mobile Device -->
  <rect x="550" y="80" width="100" height="180" rx="10" fill="#f2f2f2" stroke="#333333" stroke-width="2"/>
  <rect x="565" y="100" width="70" height="120" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <circle cx="600" cy="240" r="10" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="600" y="170" font-family="Arial" font-size="10" text-anchor="middle">Monitoring</text>
  <text x="600" y="185" font-family="Arial" font-size="10" text-anchor="middle">Application</text>
  
  <!-- BLE Connection -->
  <path d="M 350 130 Q 450 70 550 130" stroke="#0000cc" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
  <text x="450" y="80" font-family="Arial" font-size="12" text-anchor="middle" fill="#0000cc">BLE Connection</text>
  
  <!-- Workflow Steps -->
  <!-- Step 1: Connect -->
  <rect x="100" y="300" width="600" height="50" rx="5" fill="#e6e6e6" stroke="#666666" stroke-width="1"/>
  <text x="120" y="330" font-family="Arial" font-size="14" font-weight="bold">1. Connect</text>
  <text x="400" y="330" font-family="Arial" font-size="12" text-anchor="middle">Devices establish BLE connection and discover services</text>
  
  <!-- Step 2: Subscribe -->
  <rect x="100" y="360" width="600" height="50" rx="5" fill="#e6e6e6" stroke="#666666" stroke-width="1"/>
  <text x="120" y="390" font-family="Arial" font-size="14" font-weight="bold">2. Subscribe</text>
  <text x="400" y="390" font-family="Arial" font-size="12" text-anchor="middle">Monitoring app enables notifications for posture classification characteristic</text>
  
  <!-- Step 3: Classify -->
  <rect x="100" y="420" width="600" height="50" rx="5" fill="#e6e6e6" stroke="#666666" stroke-width="1"/>
  <text x="120" y="450" font-family="Arial" font-size="14" font-weight="bold">3. Classify</text>
  <text x="400" y="450" font-family="Arial" font-size="12" text-anchor="middle">Device performs posture classification using onboard neural network</text>
  
  <!-- Step 4: Notify -->
  <rect x="100" y="480" width="600" height="50" rx="5" fill="#e6e6e6" stroke="#666666" stroke-width="1"/>
  <text x="120" y="510" font-family="Arial" font-size="14" font-weight="bold">4. Notify</text>
  <text x="400" y="510" font-family="Arial" font-size="12" text-anchor="middle">Device sends notifications when posture changes or is incorrect</text>
  
  <!-- Step 5: Alert -->
  <rect x="100" y="540" width="600" height="50" rx="5" fill="#e6e6e6" stroke="#666666" stroke-width="1"/>
  <text x="120" y="570" font-family="Arial" font-size="14" font-weight="bold">5. Alert</text>
  <text x="400" y="570" font-family="Arial" font-size="12" text-anchor="middle">Mobile app provides user feedback for improper postures</text>
  
  <!-- Workflow Arrows -->
  <line x1="400" y1="350" x2="400" y2="360" stroke="#666666" stroke-width="2"/>
  <polygon points="400,360 395,350 405,350" fill="#666666"/>
  
  <line x1="400" y1="410" x2="400" y2="420" stroke="#666666" stroke-width="2"/>
  <polygon points="400,420 395,410 405,410" fill="#666666"/>
  
  <line x1="400" y1="470" x2="400" y2="480" stroke="#666666" stroke-width="2"/>
  <polygon points="400,480 395,470 405,470" fill="#666666"/>
  
  <line x1="400" y1="530" x2="400" y2="540" stroke="#666666" stroke-width="2"/>
  <polygon points="400,540 395,530 405,530" fill="#666666"/>
  
  <!-- GATT Example -->
  <rect x="50" y="220" width="300" height="60" rx="5" fill="#e6ffe6" stroke="#009900" stroke-width="1"/>
  <text x="200" y="240" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Posture Detection Service (UUID: 0x1815)</text>
  <text x="200" y="260" font-family="Arial" font-size="10" text-anchor="middle">Posture Classification (UUID: 0x2A1C) - Read, Notify</text>
  <text x="200" y="275" font-family="Arial" font-size="10" text-anchor="middle">System Control (UUID: 0x2A56) - Read, Write</text>
  
  <!-- Mobile App UI Example -->
  <rect x="500" y="300" width="200" height="90" rx="5" fill="#ffe6e6" stroke="#cc0000" stroke-width="1"/>
  <text x="600" y="320" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Mobile App Notification</text>
  <text x="600" y="340" font-family="Arial" font-size="10" text-anchor="middle">"Improper Sitting posture"</text>
  <text x="600" y="355" font-family="Arial" font-size="10" text-anchor="middle">17:09:40.384</text>
  <text x="600" y="380" font-family="Arial" font-size="10" text-anchor="middle" fill="#cc0000">Tap to see correction guidance</text>
</svg>
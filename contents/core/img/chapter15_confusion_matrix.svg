<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Confusion Matrix for Posture Classification (Test Set)</text>
  
  <!-- Matrix Container -->
  <rect x="100" y="70" width="600" height="450" fill="#f9f9f9" stroke="#ccc" stroke-width="1"/>
  
  <!-- Row Headers -->
  <text x="90" y="125" font-family="Arial" font-size="12" text-anchor="end" font-weight="bold">Correct Sitting</text>
  <text x="90" y="215" font-family="Arial" font-size="12" text-anchor="end" font-weight="bold">Correct Squat</text>
  <text x="90" y="305" font-family="Arial" font-size="12" text-anchor="end" font-weight="bold">Improper Sitting</text>
  <text x="90" y="395" font-family="Arial" font-size="12" text-anchor="end" font-weight="bold">Incorrect Bent</text>
  <text x="90" y="485" font-family="Arial" font-size="12" text-anchor="end" font-weight="bold">Walking</text>
  
  <!-- Column Headers -->
  <text x="160" y="65" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Correct Sitting</text>
  <text x="280" y="65" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Correct Squat</text>
  <text x="400" y="65" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Improper Sitting</text>
  <text x="520" y="65" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Incorrect Bent</text>
  <text x="640" y="65" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Walking</text>
  
  <!-- Grid Lines -->
  <line x1="100" y1="160" x2="700" y2="160" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="250" x2="700" y2="250" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="340" x2="700" y2="340" stroke="#ccc" stroke-width="1"/>
  <line x1="100" y1="430" x2="700" y2="430" stroke="#ccc" stroke-width="1"/>
  
  <line x1="220" y1="70" x2="220" y2="520" stroke="#ccc" stroke-width="1"/>
  <line x1="340" y1="70" x2="340" y2="520" stroke="#ccc" stroke-width="1"/>
  <line x1="460" y1="70" x2="460" y2="520" stroke="#ccc" stroke-width="1"/>
  <line x1="580" y1="70" x2="580" y2="520" stroke="#ccc" stroke-width="1"/>
  
  <!-- Cells: Correct Sitting row -->
  <rect x="100" y="70" width="120" height="90" fill="#4CAF50" fill-opacity="1.0" stroke="#ccc" stroke-width="1"/>
  <rect x="220" y="70" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="340" y="70" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="460" y="70" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="580" y="70" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  
  <!-- Cells: Correct Squat row -->
  <rect x="100" y="160" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="220" y="160" width="120" height="90" fill="#4CAF50" fill-opacity="1.0" stroke="#ccc" stroke-width="1"/>
  <rect x="340" y="160" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="460" y="160" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="580" y="160" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  
  <!-- Cells: Improper Sitting row -->
  <rect x="100" y="250" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="220" y="250" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="340" y="250" width="120" height="90" fill="#4CAF50" fill-opacity="0.2" stroke="#ccc" stroke-width="1"/>
  <rect x="460" y="250" width="120" height="90" fill="#4CAF50" fill-opacity="0.8" stroke="#ccc" stroke-width="1"/>
  <rect x="580" y="250" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  
  <!-- Cells: Incorrect Bent row -->
  <rect x="100" y="340" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="220" y="340" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="340" y="340" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="460" y="340" width="120" height="90" fill="#4CAF50" fill-opacity="1.0" stroke="#ccc" stroke-width="1"/>
  <rect x="580" y="340" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  
  <!-- Cells: Walking row -->
  <rect x="100" y="430" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="220" y="430" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="340" y="430" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="460" y="430" width="120" height="90" fill="#4CAF50" fill-opacity="0.0" stroke="#ccc" stroke-width="1"/>
  <rect x="580" y="430" width="120" height="90" fill="#4CAF50" fill-opacity="1.0" stroke="#ccc" stroke-width="1"/>
  
  <!-- Cell Values -->
  <text x="160" y="125" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold">100%</text>
  <text x="280" y="125" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="400" y="125" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="520" y="125" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="640" y="125" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  
  <text x="160" y="215" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="280" y="215" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold">100%</text>
  <text x="400" y="215" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="520" y="215" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="640" y="215" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  
  <text x="160" y="305" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="280" y="305" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="400" y="305" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">20%</text>
  <text x="520" y="305" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold">80%</text>
  <text x="640" y="305" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  
  <text x="160" y="395" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="280" y="395" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="400" y="395" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="520" y="395" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold">100%</text>
  <text x="640" y="395" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  
  <text x="160" y="485" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="280" y="485" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="400" y="485" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="520" y="485" font-family="Arial" font-size="24" text-anchor="middle">0%</text>
  <text x="640" y="485" font-family="Arial" font-size="24" text-anchor="middle" fill="white" font-weight="bold">100%</text>
  
  <!-- Axis Labels -->
  <text x="400" y="545" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">Predicted Class</text>
  <text x="50" y="295" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" transform="rotate(-90, 50, 295)">Actual Class</text>
  
  <!-- Legend -->
  <rect x="320" y="560" width="15" height="15" fill="#4CAF50" fill-opacity="1.0" stroke="#ccc" stroke-width="1"/>
  <text x="340" y="573" font-family="Arial" font-size="12">Correct Classification</text>
  <rect x="460" y="560" width="15" height="15" fill="#4CAF50" fill-opacity="0.5" stroke="#ccc" stroke-width="1"/>
  <text x="480" y="573" font-family="Arial" font-size="12">Misclassification</text>
</svg>